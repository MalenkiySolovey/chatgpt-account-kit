name: Quality Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ChatGpt.Accounts.sln
      - name: Build
        run: dotnet build ChatGpt.Accounts.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/ChatGpt.Accounts.Tests/ChatGpt.Accounts.Tests.csproj -c Release --no-build
      - name: JSON CLI synthetic smoke
        run: ./eng/verify-cli-json.ps1
      - name: Verify formatting
        run: |
          dotnet format whitespace ChatGpt.Accounts.sln --verify-no-changes --no-restore
          dotnet format analyzers ChatGpt.Accounts.sln --verify-no-changes --no-restore
      - name: Dependency audit
        run: dotnet list ChatGpt.Accounts.sln package --vulnerable --include-transitive
      - name: Pack
        run: dotnet pack src/ChatGpt.Accounts/ChatGpt.Accounts.csproj -c Release --no-build -o artifacts/packages
      - name: Restore package-only consumer
        run: dotnet restore examples/ChatGpt.Accounts.PackageConsumer/ChatGpt.Accounts.PackageConsumer.csproj --configfile eng/NuGet.PackageSmoke.config
      - name: External package consumer smoke
        run: dotnet run --project examples/ChatGpt.Accounts.PackageConsumer/ChatGpt.Accounts.PackageConsumer.csproj -c Release --no-restore
      - name: Verify patch whitespace
        run: git diff --check
